version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: scholarship-discovery-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-ouroboros_scholarship_db}
    ports:
      - "${DOCKER_MYSQL_PORT:-3310}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  scholarship-discovery:
    build: .
    container_name: scholarship-discovery-service
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8003:8003"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-ouroboros_scholarship_db}
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-root_password}
      - ALLOW_DB_FAILURE=false
      - INTERNAL_TOKEN_VERIFY_ENABLED=${INTERNAL_TOKEN_VERIFY_ENABLED:-true}
      - INTERNAL_TOKEN_SIGNING_ALGORITHM=${INTERNAL_TOKEN_SIGNING_ALGORITHM:-HS256}
      - INTERNAL_TOKEN_PUBLIC_KEY=${INTERNAL_TOKEN_PUBLIC_KEY:-internal-test-signing-key-with-32-bytes}
      - INTERNAL_TOKEN_ISSUER=${INTERNAL_TOKEN_ISSUER:-ouroboros-orchestrator-internal}
      - INTERNAL_TOKEN_AUDIENCE=${INTERNAL_TOKEN_AUDIENCE:-ouroboros.scholarship-discovery}
      - LOG_LEVEL=DEBUG
    volumes:
      - .:/app
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload

volumes:
  mysql_data:
